# Owned by house-template-dotnet. On every pull request, checks that every package the backend pins
# still has a release within a year (or is accepted in backend/package-health.json until a date).
name: Package health

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  freshness:
    name: Every package has a release within a year
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the latest release of each package
        run: python3 tools/check_package_health.py
