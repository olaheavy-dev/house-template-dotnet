# house-template-dotnet: the .NET backend layer. Apply it after house-template-base, in the same
# project, with its own answers file:
#   copier copy --trust -a .copier-answers.dotnet.yml gh:olaheavy-dev/house-template-dotnet .
# It owns backend/, global.json, mk/dotnet.mk and its rules file, and reads the base answers
# (project name, stacks) through _external_data instead of asking again.
# Copier docs: https://copier.readthedocs.io/en/stable/configuring/

_min_copier_version: "9.19.0"
_subdirectory: template
_answers_file: .copier-answers.dotnet.yml
_templates_suffix: .jinja
_envops:
  keep_trailing_newline: true
  undefined: jinja2.StrictUndefined
# Copier's defaults plus what a local build or test run leaves in template/backend.
_exclude:
  - copier.yml
  - "~*"
  - .git
  - .DS_Store
  - bin
  - obj
  - TestResults
  - StrykerOutput
  - .artifacts
  - "*.user"
  # Reqnroll generates each feature's code-behind at build time.
  - "*.feature.cs"
  # A developer's local settings and keys must never reach a generated project.
  - .env
  - .env.*
  - "!.env.example"
  - "appsettings.*.local.json"
_external_data:
  base: .copier-answers.base.yml
# The project owns its lock files after the first copy: a template update or a new package changes
# backend/Directory.Packages.props, and `make lock-backend` brings the lock files in line.
_skip_if_exists:
  - "backend/**/packages.lock.json"
_message_after_copy: |
  The .NET layer is in backend/. Next:
    1. make install && make check   (needs the .NET SDK global.json names)
    2. git add -A && git commit -m "chore: add the house-template-dotnet layer"

api_title:
  type: str
  help: The API's display name (the ping endpoint and the OpenAPI document show it)
  default: "{{ _external_data.base.project_name ~ ' API' if _external_data.base else 'API' }}"
  validator: >-
    {% if not _external_data.base %}Apply house-template-base first: .copier-answers.base.yml is missing
    {%- elif 'dotnet' not in _external_data.base.stacks %}The base answers don't list the dotnet stack: run
    copier update -a .copier-answers.base.yml and add it, so CI, CodeQL and Dependabot cover the backend
    {%- elif not api_title.strip() %}A title is required
    {%- elif api_title | list | select('lt', ' ') | list %}The title can't hold control characters (a tab or a
    line break){% endif %}

# The title inside a JSON string in backend/openapi/v1.json, escaped as the OpenAPI generator escapes
# it (only " and \, with control characters refused above), so the committed document matches
# what the build writes byte for byte. Computed, never asked or stored.
api_title_in_json:
  type: str
  when: false
  default: '{{ api_title | replace("\\", "\\\\") | replace(''"'', ''\\"'') }}'
